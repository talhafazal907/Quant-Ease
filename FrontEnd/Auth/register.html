<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantEase | Create account</title>
    
    <!-- Import Montserrat and Open Sans from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Color Palette & Typography */
        :root {
            --bg-color: #f4f4f4;
            --primary-color: #020d20;
            --secondary-color: #3d7c1f;
            --error-color: #d32f2f;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Open Sans', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-color);
        }

        /* Card Layout */
        .register-card {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(2, 13, 32, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            min-height: 500px;
        }

        /* Left Half: Form */
        .form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h2 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .form-section p {
            margin-bottom: 24px;
            color: #666;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary-color);
        }

        .input-group input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(61, 124, 31, 0.14);
        }

        button.register-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button.register-btn:hover {
            background-color: #2e5e17; /* A slightly darker shade of secondary */
        }

        .login-link {
            margin-top: 18px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .login-link a { color: var(--secondary-color); font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }

        /* Error Message Container */
        #error-message {
            display: none;
            color: var(--error-color);
            background-color: #fdeaea;
            border-left: 4px solid var(--error-color);
            padding: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            border-radius: 4px;
        }

        /* Right Half: Mascot */
        .mascot-section {
            flex: 1;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .mascot-section img {
            max-width: 80%;
            height: auto;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .register-card {
                flex-direction: column-reverse; /* Form on top, mascot on bottom for mobile */
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
            .mascot-section {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="register-card">
        <!-- Left Half: Registration Form -->
        <div class="form-section">
            <h2>Create Account</h2>
            <p>Join Quant-Ease and automate your trading edge.</p>

            <div id="error-message" role="alert" aria-live="polite"></div>

            <form id="registerForm" type = "submit" method = "POST">
                <div class="form-row">
                    <div class="input-group">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" name="firstname" required autocomplete="given-name" autofocus>
                    </div>
                    <div class="input-group">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" name="lastname" required autocomplete="family-name">
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="name@example.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Choose a password">
                </div>
                
                <button type="submit" class="register-btn" id="submitBtn">Register</button>
                <p class="login-link">Already have an account? <a href="login.html">Log in</a></p>
            </form>
        </div>

        <!-- Right Half: Mascot -->
        <div class="mascot-section">
            <img src="../mascot.svg" alt="QuantEase mascot">
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(event) {
            // Prevent the default HTML form submission
            event.preventDefault();

            // Clear previous errors and update button state
            const errorDiv = document.getElementById('error-message');
            const submitBtn = document.getElementById('submitBtn');
            errorDiv.style.display = 'none';
            submitBtn.textContent = 'Processing...';
            submitBtn.disabled = true;

            // Gather data from the form
            const formData = {
                f_name: document.getElementById('firstname').value,
                l_name: document.getElementById('lastname').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                // Send JSON request to FastAPI endpoint
                const response = await fetch('http://127.0.0.1:8000/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok){
                    // Success! Redirect to the verification page
                    window.location.href = 'verify_email.html';
                } else {
                    // Handle failure (e.g., email already exists, weak password)
                    // FastAPI typically returns errors in a "detail" key
                    const errorData = await response.json();
                    const errorMessage = errorData.detail || errorData.message || 'Registration failed. Please try again.';
                    
                    errorDiv.textContent = errorMessage;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                // Handle network errors (e.g., backend is down)
                errorDiv.textContent = 'Network error. Please ensure the server is running and try again.';
                errorDiv.style.display = 'block';
            } finally {
                // Reset button state
                submitBtn.textContent = 'Register';
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>

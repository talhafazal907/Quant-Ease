<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant-Ease | Verify Email</title>
    
    <!-- Import Montserrat and Open Sans from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Color Palette & Typography */
        :root {
            --bg-color: #f4f4f4;
            --primary-color: #020d20;
            --secondary-color: #3d7c1f;
            --error-color: #d32f2f;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Open Sans', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            color: var(--primary-color);
        }

        /* Card Layout */
        .verify-card {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(2, 13, 32, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            min-height: 500px;
        }

        /* Left Half: Form */
        .form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-section h2 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .form-section p.subtitle {
            margin-bottom: 15px;
            color: #666;
            font-size: 15px;
        }

        .spam-notice {
            background-color: #eef2eb;
            color: var(--secondary-color);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 24px;
            border-left: 4px solid var(--secondary-color);
            font-weight: 500;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--primary-color);
        }

        .input-group input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Open Sans', sans-serif;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .input-group input#code {
            letter-spacing: 4px;
            font-size: 18px;
            font-weight: 600;
        }

        button.verify-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        button.verify-btn:hover {
            background-color: #2e5e17;
        }

        /* Error Message Container */
        #error-message {
            display: none;
            color: var(--error-color);
            background-color: #fdeaea;
            border-left: 4px solid var(--error-color);
            padding: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            border-radius: 4px;
        }

        /* Right Half: Mascot */
        .mascot-section {
            flex: 1;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .mascot-section img {
            max-width: 80%;
            height: auto;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .verify-card {
                flex-direction: column-reverse;
            }
            .mascot-section {
                padding: 20px;
                min-height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="verify-card">
        <!-- Left Half: Verification Form -->
        <div class="form-section">
            <h2>Verify Email</h2>
            <p class="subtitle">Enter the 4-digit code sent to your inbox.</p>

            <div class="spam-notice">
                (Please check your spam folder in case you didn't find your code from Quant-Ease)
            </div>

            <div id="error-message"></div>

            <form id="verifyForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>
                
                <div class="input-group">
                    <label for="code">4-Digit Code</label>
                    <input type="text" id="code" name="code" required maxlength="4" pattern="\d{4}" placeholder="1234" autocomplete="one-time-code">
                </div>
                
                <button type="submit" class="verify-btn" id="submitBtn">Verify Account</button>
            </form>
        </div>

        <!-- Right Half: Mascot -->
        <div class="mascot-section">
            <img src="mascot.svg" alt="Quant-Ease Mascot">
        </div>
    </div>

    <script>
        document.getElementById('verifyForm').addEventListener('submit', async function(event) {
            // Prevent standard form submission
            event.preventDefault();

            // Setup UI states
            const errorDiv = document.getElementById('error-message');
            const submitBtn = document.getElementById('submitBtn');
            errorDiv.style.display = 'none';
            submitBtn.textContent = 'Verifying...';
            submitBtn.disabled = true;

            // Gather inputs (code is extracted as a string)
            const payload = {
                email: document.getElementById('email').value,
                code: document.getElementById('code').value
            };

            try {
                // Send JSON request to local FastAPI backend
                const response = await fetch('http://127.0.0.1:8000/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.status === 200) {
                    // Success! Route the user to login
                    window.location.href = 'login.html';
                } else {
                    // Handle 500 or other failure statuses
                    const errorData = await response.json();
                    const errorMessage = errorData.detail || errorData.message || 'Verification failed. Please check your code and try again.';
                    
                    errorDiv.textContent = errorMessage;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                // Handle network/connection errors
                errorDiv.textContent = 'Network error. Could not connect to the backend server.';
                errorDiv.style.display = 'block';
            } finally {
                // Restore button state
                submitBtn.textContent = 'Verify Account';
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
